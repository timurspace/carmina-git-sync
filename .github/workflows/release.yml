name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Prerelease tag; must exactly match manifest.json version"
        required: true
        default: "0.2.1-alpha.5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release version
        shell: bash
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "${{ steps.release.outputs.tag }}" ]; then
            echo "Release tag must exactly match manifest.json version."
            echo "tag=${{ steps.release.outputs.tag }}"
            echo "manifest=$MANIFEST_VERSION"
            exit 1
          fi

      - name: Create prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Carmina Git Sync ${{ steps.release.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            versions.json
          token: ${{ secrets.GITHUB_TOKEN }}
